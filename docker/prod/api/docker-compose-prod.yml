# prod API 스택.
#
# 리버스 프록시(traefik)는 이 파일에 없다. client 레포의 kokomen-traefik-prod가
# 한 호스트의 유일한 내부 라우터로서 클라이언트와 API를 모두 라우팅한다.
# API는 아래 컨테이너 라벨로 선언되고, traefik의 docker provider가 그것을 읽는다.
# blue-green은 "어느 색 컨테이너가 떠 있는지"로 결정된다.

services:
  kokomen-api-blue:
    image: samhap/kokomen-interview-api:prod
    container_name: kokomen-api-blue
    restart: on-failure:3
    expose:
      - "8080"
      - "8081"
    volumes:
      - ./app/logs:/logs
    environment:
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
      HOSTNAME: ${HOSTNAME}
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL_PROD: ${SPRING_DATASOURCE_URL_PROD}
      SPRING_DATASOURCE_USERNAME_PROD: ${SPRING_DATASOURCE_USERNAME_PROD}
      SPRING_DATASOURCE_PASSWORD_PROD: ${SPRING_DATASOURCE_PASSWORD_PROD}
      REDIS_PRIMARY_HOST_PROD: ${REDIS_PRIMARY_HOST_PROD}
      KAKAO_CLIENT_ID_PROD: ${KAKAO_CLIENT_ID_PROD}
      KAKAO_CLIENT_SECRET_PROD: ${KAKAO_CLIENT_SECRET_PROD}
      KAKAO_ADMIN_KEY_PROD: ${KAKAO_ADMIN_KEY_PROD}
      SUPERTONE_API_TOKEN: ${SUPERTONE_API_TOKEN}
      GOOGLE_CLIENT_ID_PROD: ${GOOGLE_CLIENT_ID_PROD}
      GOOGLE_CLIENT_SECRET_PROD: ${GOOGLE_CLIENT_SECRET_PROD}
      WIDGET_SECRET_KEY_PROD: ${WIDGET_SECRET_KEY_PROD}
      SLACK_WEBHOOK_URL_PROD: ${SLACK_WEBHOOK_URL_PROD}
      # EC2 밖에서는 IAM 인스턴스 프로파일(IMDS)이 없어 액세스 키로 인증해야 한다.
      # Bedrock(us-east-1)과 S3(ap-northeast-2) 모두 이 자격증명을 쓴다.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      kokomen-mysql-prod:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # 통합 traefik에서는 클라이언트 트래픽까지 삼키므로 Host로 한정해야 한다.
      - "traefik.http.routers.api.rule=Host(`api.kokomen.kr`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
      - "traefik.http.services.api.loadbalancer.healthcheck.path=/actuator/health"
      - "traefik.http.services.api.loadbalancer.healthcheck.port=8081"
      - "traefik.http.services.api.loadbalancer.healthcheck.interval=5s"
      - "traefik.http.services.api.loadbalancer.healthcheck.timeout=3s"
    networks:
      - prod-kokomen-net
    profiles:
      - blue

  kokomen-api-green:
    image: samhap/kokomen-interview-api:prod
    container_name: kokomen-api-green
    restart: on-failure:3
    expose:
      - "8080"
      - "8081"
    volumes:
      - ./app/logs:/logs
    environment:
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
      HOSTNAME: ${HOSTNAME}
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL_PROD: ${SPRING_DATASOURCE_URL_PROD}
      SPRING_DATASOURCE_USERNAME_PROD: ${SPRING_DATASOURCE_USERNAME_PROD}
      SPRING_DATASOURCE_PASSWORD_PROD: ${SPRING_DATASOURCE_PASSWORD_PROD}
      REDIS_PRIMARY_HOST_PROD: ${REDIS_PRIMARY_HOST_PROD}
      KAKAO_CLIENT_ID_PROD: ${KAKAO_CLIENT_ID_PROD}
      KAKAO_CLIENT_SECRET_PROD: ${KAKAO_CLIENT_SECRET_PROD}
      KAKAO_ADMIN_KEY_PROD: ${KAKAO_ADMIN_KEY_PROD}
      SUPERTONE_API_TOKEN: ${SUPERTONE_API_TOKEN}
      GOOGLE_CLIENT_ID_PROD: ${GOOGLE_CLIENT_ID_PROD}
      GOOGLE_CLIENT_SECRET_PROD: ${GOOGLE_CLIENT_SECRET_PROD}
      WIDGET_SECRET_KEY_PROD: ${WIDGET_SECRET_KEY_PROD}
      SLACK_WEBHOOK_URL_PROD: ${SLACK_WEBHOOK_URL_PROD}
      # EC2 밖에서는 IAM 인스턴스 프로파일(IMDS)이 없어 액세스 키로 인증해야 한다.
      # Bedrock(us-east-1)과 S3(ap-northeast-2) 모두 이 자격증명을 쓴다.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      kokomen-mysql-prod:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # 통합 traefik에서는 클라이언트 트래픽까지 삼키므로 Host로 한정해야 한다.
      - "traefik.http.routers.api.rule=Host(`api.kokomen.kr`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
      - "traefik.http.services.api.loadbalancer.healthcheck.path=/actuator/health"
      - "traefik.http.services.api.loadbalancer.healthcheck.port=8081"
      - "traefik.http.services.api.loadbalancer.healthcheck.interval=5s"
      - "traefik.http.services.api.loadbalancer.healthcheck.timeout=3s"
    networks:
      - prod-kokomen-net
    profiles:
      - green

  node:
    image: prom/node-exporter
    container_name: kokomen-node-prod
    restart: unless-stopped
    pid: host
    command:
      - '--path.rootfs=/host'
    volumes:
      - '/:/host:ro'
    environment:
      TZ: Asia/Seoul
    networks:
      - prod-kokomen-net

  promtail:
    image: grafana/promtail
    container_name: kokomen-promtail-prod
    volumes:
      - ./promtail/promtail.yaml:/etc/promtail/promtail.yaml
      - ./app/logs:/logs/app
      - promtail-tmp:/tmp
    command:
      - "-config.file=/etc/promtail/promtail.yaml"
      - "-config.expand-env=true"
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      HOSTNAME: ${HOSTNAME}
    networks:
      - prod-kokomen-net

  kokomen-mysql-prod:
    image: mysql:8.4
    container_name: kokomen-mysql-prod
    command:
      [
        "mysqld",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_general_ci",
        "--innodb-buffer-pool-size=1G"
      ]
    volumes:
      - mysql-prod-data:/var/lib/mysql
    restart: always
    environment:
      TZ: Asia/Seoul
      MYSQL_USER: ${SPRING_DATASOURCE_USERNAME_PROD}
      MYSQL_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_PROD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD_PROD}
      MYSQL_DATABASE: kokomen
      LANG: C.UTF-8
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks:
      - prod-kokomen-net

  kokomen-redis-prod:
    image: valkey/valkey:8.0.1
    container_name: kokomen-redis-prod
    restart: unless-stopped
    volumes:
      - redis-prod-data:/data
    environment:
      TZ: Asia/Seoul
    networks:
      - prod-kokomen-net

volumes:
  promtail-tmp:
  mysql-prod-data:
  redis-prod-data:

networks:
  prod-kokomen-net:
    external: true
    driver: bridge
