services:
  kokomen-interview-api-dev:
    image: samhap/kokomen-interview-api:dev
    container_name: kokomen-interview-api-dev
    restart: on-failure:3
    # SIGTERM 뒤 SIGKILL까지의 유예(prod와 같다: 웹 서버 종료 단계 60초 + 채점 실행기 대기 100초 + 여유).
    # dev 배포 워크플로는 docker rm -f로 바로 멈춰 이 값이 적용되지 않는다. docker compose stop·restart, docker stop(-t 없이),
    # 설정이 바뀐 컨테이너를 compose가 다시 만들 때 적용된다.
    stop_grace_period: 180s
    expose:
      - "8080"
      - "8081"
    volumes:
      - ./interview/api/app/logs:/logs
    environment:
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
      HOSTNAME: ${HOSTNAME}
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL_DEV: ${SPRING_DATASOURCE_URL_DEV}
      SPRING_DATASOURCE_USERNAME_DEV: ${SPRING_DATASOURCE_USERNAME_DEV}
      SPRING_DATASOURCE_PASSWORD_DEV: ${SPRING_DATASOURCE_PASSWORD_DEV}
      KAKAO_CLIENT_ID_DEV: ${KAKAO_CLIENT_ID_DEV}
      KAKAO_CLIENT_SECRET_DEV: ${KAKAO_CLIENT_SECRET_DEV}
      KAKAO_ADMIN_KEY_DEV: ${KAKAO_ADMIN_KEY_DEV}
      SUPERTONE_API_TOKEN: ${SUPERTONE_API_TOKEN}
      GOOGLE_CLIENT_ID_DEV: ${GOOGLE_CLIENT_ID_DEV}
      GOOGLE_CLIENT_SECRET_DEV: ${GOOGLE_CLIENT_SECRET_DEV}
      WIDGET_SECRET_KEY_DEV: ${WIDGET_SECRET_KEY_DEV}
      SLACK_WEBHOOK_URL_DEV: ${SLACK_WEBHOOK_URL_DEV}
      # EC2 밖에서는 IAM 인스턴스 프로파일(IMDS)이 없어 액세스 키로 인증해야 한다.
      # Bedrock(us-east-1)과 S3(ap-northeast-2) 모두 이 자격증명을 쓴다.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    depends_on:
      kokomen-mysql-dev:
        condition: service_healthy
    networks:
      - dev-kokomen-net

  kokomen-node:
    image: prom/node-exporter
    container_name: kokomen-node
    restart: unless-stopped
    pid: host
    command:
      - '--path.rootfs=/host'
    volumes:
      - '/:/host:ro'
    environment:
      TZ: Asia/Seoul
    networks:
      - dev-kokomen-net

  kokomen-mysql-dev:
    image: mysql:8.4.5
    container_name: kokomen-mysql-dev
    command:
      [
        "mysqld",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_general_ci"
      ]
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-init:/docker-entrypoint-initdb.d
    restart: always
    environment:
      TZ: Asia/Seoul
      MYSQL_USER: ${SPRING_DATASOURCE_USERNAME_DEV}
      MYSQL_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_DEV}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD_DEV}
      MYSQL_DATABASE: kokomen-dev
      LANG: C.UTF-8
      MYSQL_INIT_CONNECT: "SET NAMES utf8mb4"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks:
      - dev-kokomen-net

  kokomen-redis-dev:
    image: valkey/valkey:8.0.1
    container_name: kokomen-redis-dev
    restart: unless-stopped
    volumes:
      - kokomen-redis-data:/data
    environment:
      TZ: Asia/Seoul
    networks:
      - dev-kokomen-net

  kokomen-promtail:
    image: grafana/promtail
    container_name: kokomen-promtail
    volumes:
      - ./promtail/promtail.yaml:/etc/promtail/promtail.yaml
      - ./interview/api/app/logs:/logs/interviews/api
      - promtail-tmp:/tmp
    command:
      - "-config.file=/etc/promtail/promtail.yaml"
      - "-config.expand-env=true"
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      HOSTNAME: ${HOSTNAME}
    networks:
      - dev-kokomen-net

volumes:
  promtail-tmp:
  mysql-data:
  mysql-init:
  kokomen-redis-data:

networks:
  dev-kokomen-net:
    external: true
